<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wandel | Marketing Digital</title>
  <style>
    :root {
      --bg-dark: #0b132b;
      --bg-card: #1c2541;
      --accent-gradient: linear-gradient(135deg, #8e2de2 0%, #ff416c 100%);
      --text-light: #ffffff;
      --text-muted: #a0aec0;
      --whatsapp-green: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
    }

    /* Header & Nav */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5%;
      background-color: rgba(11, 19, 43, 0.9);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 1px;
    }

    .logo-w {
      width: 40px;
      height: 40px;
      background: var(--accent-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.5rem;
      color: #fff;
    }

    nav a {
      color: var(--text-light);
      text-decoration: none;
      margin-left: 1.5rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ff416c;
    }

    /* Hero Section */
    .hero {
      padding: 5rem 5% 4rem;
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .hero p {
      font-size: 1.3rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
    }

    .btn-whatsapp {
      background-color: var(--whatsapp-green);
      color: #fff;
      margin-left: 1rem;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    /* Servicios */
    .services {
      padding: 4rem 5%;
      background-color: #0d1630;
    }

    .section-title {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 3rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--bg-card);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      font-size: 1.3rem;
      margin-bottom: 0.8rem;
      color: #ff416c;
    }

    /* Contacto & Footer */
    .contact {
      padding: 4rem 5%;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }

      text
